[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-face-recognition"
version = "0.1.0"
description = "Local, evidence-oriented YuNet/SFace open-set recognition capstone"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "opencv-python>=4.8,<5", "numpy>=1.26,<3", "scikit-learn>=1.4,<2",
  "Pillow>=10,<13", "joblib>=1.3,<2", "matplotlib>=3.7,<4", "pytest>=8,<10"
]

[project.scripts]
facecap = "facecap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
